# Liquid Glass — Foot
#
# Replaces Omarchy's generated foot.ini. `alpha` is only valid under [colors],
# so the palette is declared there (with the alpha) and mirrored into
# [colors-dark] for the light/dark-aware path Omarchy's template targets.
# Foot applies alpha to the background only, leaving glyphs opaque.

[colors]
alpha=0.84

foreground=D6E4DE
background=070E0C
selection-foreground=070E0C
selection-background=6BCCA9

cursor=070E0C A8E4D3

regular0=16241E
