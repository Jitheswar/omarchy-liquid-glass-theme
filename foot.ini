# Liquid Glass — Foot
#
# Replaces Omarchy's generated foot.ini. `alpha` is only valid under [colors],
# so the palette is declared there (with the alpha) and mirrored into
# [colors-dark] for the light/dark-aware path Omarchy's template targets.
# Foot applies alpha to the background only, leaving glyphs opaque.

[colors]
alpha=0.74

foreground=E0E0E0
background=0A0A0A
selection-foreground=0A0A0A
selection-background=C8C8C8

cursor=0A0A0A FFFFFF

regular0=1A1A1A
regular1=F2798F
regular2=6FBF7A
regular3=E5CE8A
regular4=6FB6D6
regular5=B49BE0
regular6=74C7CE
regular7=C6C6C6

bright0=6E6E6E
bright1=FF97A8
bright2=8FD895
bright3=F5E2A8
bright4=96CFE8
bright5=CBB6F0
bright6=96DCE2
bright7=F2F2F2

[colors-dark]
foreground=E0E0E0
background=0A0A0A
selection-foreground=0A0A0A
selection-background=C8C8C8

cursor=0A0A0A FFFFFF

regular0=1A1A1A
regular1=F2798F
regular2=6FBF7A
regular3=E5CE8A
regular4=6FB6D6
