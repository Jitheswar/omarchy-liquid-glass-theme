# Liquid Glass — Hyprlock
#
# ~/.config/hypr/hyprlock.conf already blurs the wallpaper behind the lock
# screen (blur_passes = 3). These variables put a clear pane on top of it: the
# field is barely tinted, and the outline carries the bevel, so the input
# reads as a lit edge rather than a filled box.
#
# What a theme can and cannot reach here is worth stating, because it is not
# obvious. Omarchy's hyprlock.conf `source`s this file at the top and then
# writes its own `input-field { }` block, so everything below is a *variable*
# and nothing else. A second input-field block declared here would not
# override that one — it would add a second password field. That is not a
# guess: hyprlock registers the category as
#   addSpecialCategory("input-field", {.key = nullptr, .anonymousKeyBased = true})
# and an anonymous-key-based category creates one instance per block, which is
# the same mechanism that lets a hyprlock config declare several labels.
#
# So the bevel recipe arrives by a different route than in the GTK surfaces.
# There is no inset shadow and no fill gradient in hyprlock: `inner_color`
# takes a single colour. But `outer_color` is typed as a *gradient*, and the
# outline is 4px thick, which is enough to carry the whole bevel on its own —
# lit at the top, falling to shadow at the base. That is the same thing the
# 3px window border does in hyprland.conf, so the two now match by
# construction rather than by eye.
#
# Out of reach from a theme file, all of them in the input-field block of
# ~/.config/hypr/hyprlock.conf rather than here:
#
#   rounding = 0        the field is square while everything else in the
#                       theme is rounded — the one real parity gap left.
#                       radius-lg (22) is the closest step; the field is
#                       650x100, the same order of size as the OSD.
#   shadow_passes = 0   elev-3 would be the level for a modal. Turning it on
#                       needs shadow_passes = 3, shadow_size = 12,
#                       shadow_color = rgba(0, 0, 0, 0.50).
#   outline_thickness   4px, against 1px for glass-edge everywhere else. Left
#                       alone: at 1px the gradient below has no room to read
#                       as a bevel, which is the same reason hyprland.conf
#                       runs border_size = 3.
#
# Those three are the user's file to change, not the theme's. See the README.

$color        = rgba(0, 0, 0, 1.0)

# glass-fill-base, flattened. hyprlock has no gradient for the fill, so the
# ramp collapses to its bottom stop — the field sits over a wallpaper hyprlock
# has already blurred, so it can afford to stay clearer than mako's flat fill,
# which has to survive landing on top of anything at all.
$inner_color  = rgba(0, 0, 0, 0.35)

# The bevel, collapsed into the one gradient a theme can reach: glass-specular
# at the top, through the accent, down to glass-shade at the base. Same four
# stops and same 90deg as $activeBorderColor in hyprland.conf — the lock field
# is lit by the same overhead light as every window border.
$outer_color  = rgba(FFFFFFF2) rgba(FFFFFF99) rgba(80808066) rgba(000000CC) 90deg

$font_color   = rgba(255, 255, 255, 1.0)
$check_color  = rgba(255, 255, 255, 1.0)
