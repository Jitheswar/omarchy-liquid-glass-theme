# Liquid Glass — Hyprlock
#
# ~/.config/hypr/hyprlock.conf already blurs the wallpaper behind the lock
# screen (blur_passes = 3). These variables put a translucent pane on top of
# it: the field is tinted rather than filled, and the outline carries the
# specular highlight so the input reads as an edge catching light.

$color        = rgba(7, 14, 12, 1.0)
$inner_color  = rgba(18, 38, 32, 0.55)
$outer_color  = rgba(168, 228, 211, 0.80)
$font_color   = rgba(214, 228, 222, 1.0)
$check_color  = rgba(107, 204, 169, 1.0)
