# Liquid Glass — Hyprlock
#
# ~/.config/hypr/hyprlock.conf already blurs the wallpaper behind the lock
# screen (blur_passes = 3). These variables put a clear pane on top of it: the
# field is barely tinted, and the outline carries the specular highlight so the
# input reads as a lit edge rather than a filled box.

$color        = rgba(7, 14, 12, 1.0)
$inner_color  = rgba(18, 38, 32, 0.34)
$outer_color  = rgba(240, 252, 248, 0.90)
$font_color   = rgba(233, 243, 239, 1.0)
$check_color  = rgba(107, 204, 169, 1.0)
