# Liquid Glass — Ghostty
#
# Replaces Omarchy's generated ghostty.conf, so it carries the full palette
# plus the background alpha. Only the background is made translucent; glyphs
# stay solid, so Hyprland's blur frosts the pane without softening the text.

background-opacity = 0.74

background = #0A0A0A
foreground = #E0E0E0
cursor-color = #FFFFFF
selection-background = #C8C8C8
selection-foreground = #0A0A0A

palette = 0=#1A1A1A
palette = 1=#F2798F
palette = 2=#6FBF7A
palette = 3=#E5CE8A
palette = 4=#6FB6D6
palette = 5=#B49BE0
palette = 6=#74C7CE
palette = 7=#C6C6C6
palette = 8=#6E6E6E
palette = 9=#FF97A8
palette = 10=#8FD895
palette = 11=#F5E2A8
palette = 12=#96CFE8
palette = 13=#CBB6F0
palette = 14=#96DCE2
palette = 15=#F2F2F2
