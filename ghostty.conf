# Liquid Glass — Ghostty
#
# Replaces Omarchy's generated ghostty.conf, so it carries the full palette
# plus the background alpha. Only the background is made translucent; glyphs
# stay solid, so Hyprland's blur frosts the pane without softening the text.

background-opacity = 0.74

background = #070E0C
foreground = #D6E4DE
cursor-color = #A8E4D3
selection-background = #6BCCA9
selection-foreground = #070E0C

palette = 0=#16241E
palette = 1=#F2798F
palette = 2=#5FC79E
palette = 3=#E5CE8A
palette = 4=#6FB6D6
palette = 5=#B49BE0
palette = 6=#7ED9D2
palette = 7=#B2D2C9
palette = 8=#4B7265
palette = 9=#FF97A8
palette = 10=#84DEB8
palette = 11=#F5E2A8
palette = 12=#96CFE8
palette = 13=#CBB6F0
palette = 14=#A8E4D3
palette = 15=#E9F3EF
