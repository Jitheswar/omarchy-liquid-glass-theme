# Liquid Glass — Hyprland
#
# This file replaces Omarchy's generated hyprland.conf, so it has to define the
# border colours looknfeel.conf expects *and* the glass material itself.
# Sourced after ~/.local/share/omarchy/default/hypr/looknfeel.conf, so
# everything here overrides the stock look.

# The wallpaper's own edge lighting, turned into a border: a bright mint
# specular hit rolling through jade into deep teal, the way light bends
# through the rim of a curved pane.
$activeBorderColor   = rgba(A8E4D3DD) rgba(6BCCA966) rgba(2D624EAA) 45deg
$inactiveBorderColor = rgba(24413399)

general {
    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    # Glass needs room to read as a separate pane, not a tiled sheet.
    gaps_in  = 6
    gaps_out = 14

    border_size = 2
}

group {
    col.border_active          = $activeBorderColor
    col.border_inactive        = $inactiveBorderColor
    col.border_locked_active   = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor

    groupbar {
        col.active          = rgba(6BCCA955)
        col.inactive        = rgba(16241E88)
        text_color          = rgb(D6E4DE)
        text_color_inactive = rgba(D6E4DE90)
        gradient_rounding   = 8
    }
}

decoration {
    # rounding_power > 2 gives a squircle rather than a circular arc — the
    # continuous curvature is most of what makes a corner look moulded, and
    # it matches the pill in the wallpaper.
    rounding       = 18
    rounding_power = 3.0

    # Deliberately near-opaque. Transparency is supplied per-app by the
    # surface's own background alpha (see alacritty/ghostty/kitty/foot and the
    # GTK stylesheets), which frosts the panel while leaving text fully solid.
    # Dropping window opacity instead would fade the glyphs too.
    active_opacity   = 1.0
    inactive_opacity = 0.97

    # Depth cue: unfocused panes recede slightly instead of dimming hard.
    dim_inactive = true
    dim_strength = 0.10
    dim_special  = 0.40

    blur {
        enabled = true
        size    = 7
        passes  = 4

        # Menus, dropdowns and tooltips have to frost too, or they punch
        # opaque holes through the effect.
        popups             = true
        popups_ignorealpha = 0.2
        special            = true

        # Vibrancy is the difference between "glass" and "fog": it restores
        # the saturation a plain gaussian blur washes out, which matters a
        # lot with a wallpaper this saturated.
        brightness        = 1.0
        contrast          = 1.05
        vibrancy          = 0.35
        vibrancy_darkness = 0.30

        # A little grain hides the banding that shows up across wide, soft
        # gradients once they have been blurred four times.
        noise = 0.025

        new_optimizations = true

        # Off on purpose: seeing *other windows* blurred behind the front one
        # is the layered depth this theme is built around. Set to true if you
        # would rather trade that for lower GPU load.
        xray = false
    }

    shadow {
        enabled      = true
        range        = 32
        render_power = 3
        color          = rgba(00000073)
        color_inactive = rgba(0000004D)
        offset = 0 4
        scale  = 0.97
    }
}

# Omarchy's windows.conf tags every window with a blanket 0.985/0.96 opacity.
# Glass wants full opacity so the per-app background alpha does the work.
windowrule = opacity 1.0 0.97, match:tag default-opacity

# ── Shell surfaces ────────────────────────────────────────────────────────
# Each panel is frosted, and ignore_alpha keeps the transparent margin around
# a floating surface from being blurred along with it.
layerrule = blur on,            match:namespace waybar
layerrule = ignore_alpha 0.10,  match:namespace waybar
layerrule = blur_popups on,     match:namespace waybar

layerrule = blur on,            match:namespace walker
layerrule = ignore_alpha 0.20,  match:namespace walker

layerrule = blur on,            match:namespace notifications
layerrule = ignore_alpha 0.15,  match:namespace notifications

layerrule = blur on,            match:namespace swayosd
layerrule = ignore_alpha 0.15,  match:namespace swayosd

layerrule = blur on,            match:namespace logout_dialog
layerrule = ignore_alpha 0.15,  match:namespace logout_dialog
