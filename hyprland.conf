# Liquid Glass — Hyprland
#
# This file replaces Omarchy's generated hyprland.conf, so it has to define the
# border colours looknfeel.conf expects *and* the glass material itself.
# Sourced after ~/.local/share/omarchy/default/hypr/looknfeel.conf, so
# everything here overrides the stock look.
#
# The material is deliberately *clear*, not frosted. Frost is diffusion: many
# blur passes plus grain, which hides whatever is behind it. This aims at the
# other thing — thick, lit glass you can almost see through, where the edge
# does the work instead of the surface.

# The rim is a bevel, not a frame. Angled at 90° so it runs bright at the top
# and falls away to near-black at the bottom, which is how a curved edge reads
# under a single overhead light. This is the main thing selling thickness.
$activeBorderColor   = rgba(FFFFFFF2) rgba(FFFFFF99) rgba(80808066) rgba(000000CC) 90deg
$inactiveBorderColor = rgba(FFFFFF2E) rgba(00000066) 90deg

general {
    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    # Glass needs room to read as a separate pane, not a tiled sheet.
    gaps_in  = 6
    gaps_out = 14

    # 3px so the bevel gradient has enough room to actually read as a lens
    # edge. At 1-2px it collapses into a plain outline.
    border_size = 3
}

group {
    col.border_active          = $activeBorderColor
    col.border_inactive        = $inactiveBorderColor
    col.border_locked_active   = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor

    groupbar {
        col.active          = rgba(FFFFFF4D)
        col.inactive        = rgba(00000073)
        text_color          = rgb(EDEDED)
        text_color_inactive = rgba(E0E0E099)

        # The groupbar was the one surface in this theme still drawing opaque,
        # and the colours above are why it was easy to miss: they are already
        # alpha values, so the tabs *looked* translucent in the config and
        # composited over nothing. `blur` here defaults to false independently
        # of decoration:blur:enabled — a groupbar is not a window and does not
        # inherit the window blur — so a tabbed group sat as a solid strip
        # across the top of a pane whose whole argument is that you can see
        # through it. This is the line that makes the alphas above mean
        # something.
        blur = true

        # Measured over the shipped wallpaper, mean luminance (0-255) across
        # 600px of tab at increasing depth below the groupbar's top edge:
        #
        #     depth        2px    6px   10px   14px   18px
        #     active     +1.3   +5.4   +8.2   +9.1  +11.5
        #     inactive   +2.6   +4.9   +4.1   +2.5   +1.2
        #
        # That is the blur pass's brightness 1.18 and vibrancy 0.80 arriving on
        # a surface that had been compositing over raw wallpaper. The active
        # tab gains most at its base, which is where the gradient is thinnest
        # and there is most to see through.
        #
        # rounding, rounding_power and gradient_rounding_power are deliberately
        # not set alongside it, and it took measuring to know that. The tab's
        # visible shape is drawn by gradient_rounding, which is already 10, and
        # sweeping the other three changed nothing: rounding 1 -> 10 with power
        # 2 -> 4.5 gave a corner indistinguishable by eye, and
        # gradient_rounding_power 2 -> 4.5 differed by 0/255 at every pixel of
        # a 22x22 crop of the corner. Three declarations that would have looked
        # like consistency with decoration:rounding_power and done nothing.
        gradient_rounding = 10
    }
}

decoration {
    # 20 is Hyprland's ceiling. rounding_power well above 2 turns the corner
    # into a superellipse — continuous curvature rather than a circular arc
    # pasted onto a straight edge, which is most of what makes a corner look
    # moulded instead of cut.
    rounding       = 20
    rounding_power = 4.5

    # Fully opaque at the compositor level. Transparency is supplied per-app by
    # the surface's own background alpha, which leaves glyphs solid; dropping
    # window opacity here would fade the text along with the background.
    active_opacity   = 1.0
    inactive_opacity = 1.0

    # Barely there. Heavy dimming reads as "disabled"; real glass just sits
    # slightly further away.
    dim_inactive = true
    dim_strength = 0.06
    dim_special  = 0.35

    blur {
        # Low and few, on purpose. This is the single biggest difference from a
        # frosted theme: at size 4 / 3 passes you can still make out the shapes
        # behind the pane, so it reads as something you are looking *through*
        # rather than a fogged panel. Raising these to ~8/4 is what turns it
        # back into frost.
        size    = 4
        passes  = 3

        enabled = true

        # Menus, dropdowns and tooltips have to be glass too, or they punch
        # opaque holes through the effect.
        popups             = true
        popups_ignorealpha = 0.2
        special            = true

        # The same argument, one surface further out. An input method's
        # candidate window — fcitx5, ibus, anything speaking
        # zwp_input_method_v2 — is not a popup and not a layer, so neither
        # `popups` above nor the layerrules at the bottom of this file reach
        # it, and it was the last surface left rendering opaque over a glass
        # desktop. It is also the surface that spends the most time directly on
        # top of what you are reading.
        #
        # Costs nothing on a machine with no IME running: there is no surface
        # to blur, so the pass is never scheduled. Left on rather than left to
        # the reader to discover, because the people this affects are the ones
        # least likely to be reading a Hyprland config to find out why their
        # candidate list is the only grey box on the screen.
        input_methods             = true
        input_methods_ignorealpha = 0.2

        # Glass is *lit* — brighter and more saturated than what sits behind
        # it, not a grey veil over it. Brightness lifts the pane off the
        # wallpaper; vibrancy is what makes colour bleed through as refraction
        # rather than washing out to grey. vibrancy_darkness keeps that from
        # crushing the dark end, which matters on a wallpaper this black.
        brightness        = 1.18
        contrast          = 1.18
        vibrancy          = 0.80
        vibrancy_darkness = 0.45

        # Near zero. Grain is what your eye reads as "frosted" — it is the
        # texture of etched glass. Clear glass has none. Just enough left to
        # stop the wallpaper's wide gradients from banding.
        noise = 0.003

        new_optimizations = true

        # Load-bearing for the window-opacity rules at the bottom of this file.
        # The GTK/Electron/browser surfaces are made translucent by dropping
        # *window* opacity to 0.92; without this, blur strength would follow
        # that alpha down and the glass behind those windows would thin out
        # exactly where it is supposed to be doing the work.
        #
        # Hyprland already defaults this to true, so setting it changes nothing
        # today. It is here because the theme depends on it rather than merely
        # benefiting from it, and an inherited default is not a decision.
        ignore_opacity = true

        # Off on purpose: seeing *other windows* refracted behind the front one
        # is the layered depth this theme is built around. Set to true if you
        # would rather trade that for lower GPU load.
        xray = false
    }

    # ── The inner rim ─────────────────────────────────────────────────────
    # Hyprland calls this "glow" and the name misleads: it is not an outer
    # bloom. It is an *inner* one — the shader measures the distance from the
    # window's edge and fades a colour inward over `range`, using the same
    # rounding_power the corner does, so the light wraps the superellipse
    # exactly rather than approximating it.
    #
    # That last part is the whole reason it is here. Every other surface in
    # this theme fakes its lit edge with `inset 0 1px 0`, because a hairline is
    # the best GTK-CSS has. A window can have the real thing: light gathering
    # *into* the body of the glass over 14px instead of stopping dead at one
    # pixel. It is the closest this theme gets to thickness, and unlike the
    # bevel above it is not a painting of an edge — it is computed from the
    # window's own geometry.
    #
    # Measured over the shipped wallpaper. Mean luminance (0-255) of a 400px
    # row, at increasing depth below the window's top edge:
    #
    #     depth       0px    2px    4px    6px    8px   10px   14px
    #     off        28.7   29.7   30.7   31.7   32.8   33.6   35.3
    #     inactive   50.0   44.7   41.2   37.8   36.3   35.5   35.3
    #     active     88.3   73.3   61.0   50.7   43.8   38.9   37.1
    #
    # Both are back on the baseline by ~12px, and that is the point: a ramp,
    # not a second border. render_power is what shapes it — the falloff is
    # pow(1 - dist/range, power), so at 4 it collapses into a 4px spike that
    # reads as a doubled outline, and range 20 at power 3 spreads far enough to
    # look like haze, which is frost. 14/2 is the setting that ramps.
    #
    # White at low alpha on a 90deg gradient, the same construction as the
    # border: lit at the top, near nothing at the base. No hue, so the rim
    # takes its colour from whatever the blur behind it is carrying.
    #
    # One limit worth knowing before filing it as a bug: there is no per-window
    # opt-out. `no_blur`, `no_shadow` and `no_dim` all exist as window rules and
    # `no_glow` does not, so a windowed video player gets a faint white rim
    # inside its frame and nothing here can exempt it.
    #
    # Fullscreen is exempt, which covers the case where that would matter most,
    # and it was checked rather than assumed. With the glow forced to opaque red
    # at range 40, mean red across a 600px row inside the window's top edge:
    #
    #     depth        0px    3px    7px   13px
    #     windowed   213.8  181.9  143.6   94.9
    #     fullscreen  12.5   12.4   12.2   11.8
    #
    # 12.5 flat is the terminal's own content with no red in it at all. The
    # compositor drops decorations on a fullscreen window, and the rim is a
    # decoration.
    glow {
        enabled = true

        range          = 14
        render_power   = 2

        color          = rgba(FFFFFF47) rgba(FFFFFF0F) 90deg
        color_inactive = rgba(FFFFFF1A) rgba(FFFFFF00) 90deg
    }

    # Tight and close, not a halo. A big soft shadow reads as a card floating
    # above a page; glass sits nearly on the surface and catches a hard, short
    # shadow just under its bottom edge.
    #
    # The colour is a gradient rather than a flat black, which needs 0.56. A
    # cast shadow is not evenly dark: the light overhead is occluded most
    # directly under the bottom edge and least at the sides, so a shadow that
    # is one opacity all the way round is a shadow drawn by hand. Same 90deg
    # and same overhead source as the border and the rim above — three effects
    # now agreeing about where the light is instead of three tuned separately.
    #
    # Total weight is deliberately unchanged. The old flat values averaged
    # 0.40 active and 0.22 inactive; these average 0.37 and 0.22. The shadow
    # did not get heavier, it got redistributed toward the base — which is also
    # where `offset = 0 3` was already pushing it.
    shadow {
        enabled      = true
        range        = 18
        render_power = 4
        color          = rgba(00000038) rgba(00000085) 90deg
        color_inactive = rgba(00000020) rgba(00000050) 90deg
        offset = 0 3
        scale  = 0.95
    }

    # The liquid half of the name, and the one setting in this file that is
    # asserted rather than measured — so it is worth being exact about what is
    # and is not known.
    #
    # Known: the option exists in 0.56, the compositor accepts it, it engages
    # only while a window is moving or resizing, and it costs nothing at rest.
    # Not known: what the smear actually looks like. Motion blur is a function
    # of per-frame displacement, and every way of catching a frame here — a
    # screenshot mid-animation, or slowing the animation down until a
    # screenshot can catch it — removes the displacement it is meant to render.
    # Slowing the animation to photograph the blur is the same mistake as
    # measuring a car's top speed while it is parked.
    #
    # It is on because it cannot hurt anything static: no window is moving
    # while you read it. If the smear is not to your taste, `enabled = false`
    # here is the whole fix. samples is quality against GPU cost, 7 is the
    # default and 64 the ceiling; 12 is smooth on a 1080p laptop panel.
    motion_blur {
        enabled = false
        samples = 12
    }
}

# ── Motion ────────────────────────────────────────────────────────────────
# Until now this file said nothing about animation and took Omarchy's
# defaults, which open and close a layer at nearly the same rate (400ms in,
# 150ms out, both on generic curves). Glass should not behave that way. A pane
# that size has to settle when it arrives and get out of the way when
# dismissed, so the two directions are deliberately not symmetrical.
#
# Only layers are touched. Everything else — windows, workspaces, borders,
# fades — keeps the Omarchy curve it already had.
animations {
    # Opening: nearly all the distance is covered in the first third, then it
    # eases into place. This is the shape the ~0.16,1,0.3,1 family gives.
    #
    # Worth being precise about the name: this curve does not overshoot.
    # Overshoot needs a control point above 1.0, and even with one the layer
    # styles here are `fade`, so the value being animated is opacity — an
    # overshoot would just clamp at fully opaque and never be seen. The spring
    # in this comes from the asymmetry below, not from the curve exceeding its
    # target.
    bezier = glassSettle, 0.16, 1.0, 0.3, 1.0

    # Closing: plain ease-in, accelerating away. No overshoot on the way out —
    # a dismissed surface should not draw the eye back.
    bezier = glassDismiss, 0.42, 0.0, 1.0, 1.0

    # 350ms in against 200ms out. Speeds are in deciseconds.
    # Covers notifications, the logout dialog, the OSD and the bar.
    #
    # Not the launcher, and that is worth knowing before wondering why it does
    # not settle: Omarchy ships `layerrule = no_anim on, match:namespace walker`
    # in default/hypr/apps/walker.conf, sourced from windows.conf — which the
    # user's hyprland.conf sources on the line *above* this theme. Later rules
    # win, so a theme can override it, and the one-liner to do so is in the
    # README's Tuning section. It is left off by default because that is
    # upstream's call about how fast the launcher should feel, not a gap in the
    # theme; the blur and layerrules below land on walker regardless.
    animation = layersIn,  1, 3.5, glassSettle, fade
    animation = layersOut, 1, 2,   glassDismiss, fade

    # windowsMove is deliberately not set here. Dragging a window is a 1:1
    # cursor follow with no animation hook — Hyprland moves the surface to
    # where the pointer is. Putting a curve on windowsMove does not smooth a
    # drag; it adds lag between the cursor and the window during tiling
    # rearrangement, which reads as the compositor failing to keep up. The
    # absence of easing on drag is the correct behaviour, not a gap.
}

# ── Window transparency ───────────────────────────────────────────────────
# Two different mechanisms, because apps fall into two camps.
#
# Terminals can render a translucent *background* while keeping glyphs fully
# opaque (see alacritty.toml / ghostty.conf / kitty.conf / foot.ini). That is
# the good kind of glass, so they want no window opacity stacked on top of it.
windowrule = opacity 1.0 1.0, match:tag terminal

# Everything else — GTK, Electron, browsers — draws an opaque background and
# exposes no equivalent knob. The only lever Hyprland has is window opacity,
# which fades text along with the background, so it is kept mild: enough that
# the blur behind registers as glass, not so much that a page becomes hard to
# read. Blur still applies underneath because blur:ignore_opacity is on.
#
# Dial the first number toward 1.0 if you find text too soft, or toward 0.85
# for more glass. Omarchy's own rules already strip these tags from media apps
# (mpv, vlc, OBS, Zoom, YouTube tabs), so video stays fully opaque.
#
# The inactive number was 0.86 and is now 0.90, because 0.86 was measurably
# eating contrast that pages had not budgeted for. Measured by compositing
# known colour pairs and reading the result back off the screen — text against
# its own background, as WCAG contrast:
#
#                            nominal   0.86    0.90   focused 0.92
#   #949494 on #1e1e1e          5.32   3.86    4.15    4.66
#   #c0c0c0 on #1e1e1e          9.79   6.43    6.91    7.94
#   #595959 on #ffffff          7.00   4.89    5.41    5.90
#   #000000 on #ffffff         21.00  11.68   12.9    16.46
#
# Nothing here is illegible, and real body text is never close to it — black
# on white keeps 11.7:1 at the worst setting. The case that matters is the
# first row: mid-grey secondary text on a dark UI, which is what Electron
# apps label everything with. Nominally it clears AA at 5.32; at 0.86 it lands
# at 3.86 and does not. 0.90 does not fully repair that (nothing below ~1.0
# does — full opacity only measures 5.00 here), but it recovers most of the
# gap while leaving the glass intact, and the unfocused window is exactly
# where you read reference material while typing somewhere else.
#
# The active number stays at 0.92: focused, that same worst case measures
# 4.66 and clears AA on its own.
windowrule = opacity 0.92 0.90, match:tag default-opacity
windowrule = opacity 0.92 0.90, match:tag chromium-based-browser
windowrule = opacity 0.92 0.90, match:tag firefox-based-browser

# ── Shell surfaces ────────────────────────────────────────────────────────
# Each panel is glass, and ignore_alpha keeps the clear margin around a
# floating surface from being blurred along with it. The thresholds are low
# because these panels are now genuinely transparent — a higher cutoff would
# skip blurring the panel itself.
layerrule = blur on,            match:namespace waybar
layerrule = ignore_alpha 0.04,  match:namespace waybar
layerrule = blur_popups on,     match:namespace waybar

layerrule = blur on,            match:namespace walker
# 0.35 here rather than the 0.06 the other surfaces use, because the launcher
# is the only one with a big enough shadow for it to matter.
#
# ignore_alpha sets the alpha below which a pixel is left unblurred. The
# launcher carries elev-3 — `0 12px 40px rgba(0,0,0,.50)` — so the shadow
# paints a ring of semi-transparent pixels up to 40px beyond the panel, and at
# 0.06 nearly all of that ring cleared the threshold and got blurred along
# with the panel. Blur here runs at brightness 1.18 and vibrancy 0.80, which
# is exactly what makes the glass glow, and applied to a shadow it produced a
# saturated halo of whatever was behind the launcher — over a photo it read as
# a coloured blob sitting around a rounded panel, in the shape of the layer
# surface's rectangle rather than the panel's own corners.
#
# 0.35 sits above where the shadow does its spreading and below the panel's
# own alpha, so the panel still blurs and the ring no longer does. It is not
# the shadow that was wrong: shadows are not supposed to refract.
layerrule = ignore_alpha 0.35,  match:namespace walker

layerrule = blur on,            match:namespace notifications
layerrule = ignore_alpha 0.06,  match:namespace notifications

layerrule = blur on,            match:namespace swayosd
layerrule = ignore_alpha 0.06,  match:namespace swayosd

# There used to be a pair of rules here for `logout_dialog`, and they are gone
# because nothing on an Omarchy machine ever produced that namespace. The power
# menu is walker — `omarchy-menu` shells out to it, so it was already covered
# two rules up — and grepping the whole of ~/.local/share/omarchy for
# `logout_dialog` returns nothing at any version. It was almost certainly
# carried over from a wlogout-based config, which Omarchy does not ship.
#
# A layerrule that matches nothing is not harmful, which is exactly why it
# survived: it cost nothing and looked like coverage. But a reader counting the
# surfaces this theme reaches would have counted one that does not exist. If
# you do run wlogout, the line is:
#
#   layerrule = blur on,           match:namespace logout_dialog
#   layerrule = ignore_alpha 0.06, match:namespace logout_dialog

# The lock screen is deliberately absent from this list, and it is not an
# oversight. hyprlock is not a layer surface at all — it binds
# ext_session_lock_manager_v1 and draws into an ext_session_lock_surface_v1,
# which layerrule does not match under any namespace. Blur on the lock screen
# comes from hyprlock's own `background { blur_passes = 3 }` instead, and the
# glass on the field comes from the gradient in hyprlock.conf.
#
# 0.56 added a second route — `misc:session_lock_blur`, whose own help text
# says "you probably want to enable session_lock_xray" — and this theme turns
# neither on. Not for consistency's sake; they genuinely do not fit.
#
# session_lock_xray keeps your workspaces rendering underneath the lock
# surface. Against Omarchy's hyprlock, which draws an opaque wallpaper, that
# renders a desktop nobody can see and bills the GPU for it. Against a
# hyprlock someone has made translucent, it puts the contents of their session
# on the lock screen — blurred, but there. A lock screen exists to not show
# you the desktop. That is not a knob a *theme* should reach for on a user's
# behalf, whichever of the two outcomes they would have got.
