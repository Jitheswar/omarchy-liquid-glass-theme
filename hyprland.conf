# Liquid Glass — Hyprland
#
# This file replaces Omarchy's generated hyprland.conf, so it has to define the
# border colours looknfeel.conf expects *and* the glass material itself.
# Sourced after ~/.local/share/omarchy/default/hypr/looknfeel.conf, so
# everything here overrides the stock look.
#
# The material is deliberately *clear*, not frosted. Frost is diffusion: many
# blur passes plus grain, which hides whatever is behind it. This aims at the
# other thing — thick, lit glass you can almost see through, where the edge
# does the work instead of the surface.

# The rim is a bevel, not a frame. Angled at 90° so it runs bright at the top
# and falls away to near-black at the bottom, which is how a curved edge reads
# under a single overhead light. This is the main thing selling thickness.
$activeBorderColor   = rgba(F2FAF7F2) rgba(A8E4D3B3) rgba(4D8E7566) rgba(0A1613CC) 90deg
$inactiveBorderColor = rgba(B2D2C92E) rgba(0A161366) 90deg

general {
    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor

    # Glass needs room to read as a separate pane, not a tiled sheet.
    gaps_in  = 6
    gaps_out = 14

    # 3px so the bevel gradient has enough room to actually read as a lens
    # edge. At 1-2px it collapses into a plain outline.
    border_size = 3
}

group {
    col.border_active          = $activeBorderColor
    col.border_inactive        = $inactiveBorderColor
    col.border_locked_active   = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor

    groupbar {
        col.active          = rgba(6BCCA94D)
        col.inactive        = rgba(0A161373)
        text_color          = rgb(E9F3EF)
        text_color_inactive = rgba(D6E4DE99)
        gradient_rounding   = 10
    }
}

decoration {
    # 20 is Hyprland's ceiling. rounding_power well above 2 turns the corner
    # into a superellipse — continuous curvature rather than a circular arc
    # pasted onto a straight edge, which is most of what makes a corner look
    # moulded instead of cut.
    rounding       = 20
    rounding_power = 4.5

    # Fully opaque at the compositor level. Transparency is supplied per-app by
    # the surface's own background alpha, which leaves glyphs solid; dropping
    # window opacity here would fade the text along with the background.
    active_opacity   = 1.0
    inactive_opacity = 1.0

    # Barely there. Heavy dimming reads as "disabled"; real glass just sits
    # slightly further away.
    dim_inactive = true
    dim_strength = 0.06
    dim_special  = 0.35

    blur {
        # Low and few, on purpose. This is the single biggest difference from a
        # frosted theme: at size 4 / 3 passes you can still make out the shapes
        # behind the pane, so it reads as something you are looking *through*
        # rather than a fogged panel. Raising these to ~8/4 is what turns it
        # back into frost.
        size    = 4
        passes  = 3

        enabled = true

        # Menus, dropdowns and tooltips have to be glass too, or they punch
        # opaque holes through the effect.
        popups             = true
        popups_ignorealpha = 0.2
        special            = true

        # Glass is *lit* — brighter and more saturated than what sits behind
        # it, not a grey veil over it. Brightness lifts the pane off the
        # wallpaper; vibrancy is what makes colour bleed through as refraction
        # rather than washing out to grey. vibrancy_darkness keeps that from
        # crushing the dark end, which matters on a wallpaper this black.
        brightness        = 1.18
        contrast          = 1.18
        vibrancy          = 0.80
        vibrancy_darkness = 0.45

        # Near zero. Grain is what your eye reads as "frosted" — it is the
        # texture of etched glass. Clear glass has none. Just enough left to
        # stop the wallpaper's wide gradients from banding.
        noise = 0.003

        new_optimizations = true

        # Off on purpose: seeing *other windows* refracted behind the front one
        # is the layered depth this theme is built around. Set to true if you
        # would rather trade that for lower GPU load.
        xray = false
    }

    # Tight and close, not a halo. A big soft shadow reads as a card floating
    # above a page; glass sits nearly on the surface and catches a hard, short
    # shadow just under its bottom edge.
    shadow {
        enabled      = true
        range        = 18
        render_power = 4
        color          = rgba(00000066)
        color_inactive = rgba(00000038)
        offset = 0 3
        scale  = 0.95
    }
}

# ── Window transparency ───────────────────────────────────────────────────
# Two different mechanisms, because apps fall into two camps.
#
# Terminals can render a translucent *background* while keeping glyphs fully
# opaque (see alacritty.toml / ghostty.conf / kitty.conf / foot.ini). That is
# the good kind of glass, so they want no window opacity stacked on top of it.
windowrule = opacity 1.0 1.0, match:tag terminal

# Everything else — GTK, Electron, browsers — draws an opaque background and
# exposes no equivalent knob. The only lever Hyprland has is window opacity,
# which fades text along with the background, so it is kept mild: enough that
# the blur behind registers as glass, not so much that a page becomes hard to
# read. Blur still applies underneath because blur:ignore_opacity is on.
#
# Dial the first number toward 1.0 if you find text too soft, or toward 0.85
# for more glass. Omarchy's own rules already strip these tags from media apps
# (mpv, vlc, OBS, Zoom, YouTube tabs), so video stays fully opaque.
windowrule = opacity 0.92 0.86, match:tag default-opacity
windowrule = opacity 0.92 0.86, match:tag chromium-based-browser
windowrule = opacity 0.92 0.86, match:tag firefox-based-browser

# ── Shell surfaces ────────────────────────────────────────────────────────
# Each panel is glass, and ignore_alpha keeps the clear margin around a
# floating surface from being blurred along with it. The thresholds are low
# because these panels are now genuinely transparent — a higher cutoff would
# skip blurring the panel itself.
layerrule = blur on,            match:namespace waybar
layerrule = ignore_alpha 0.04,  match:namespace waybar
layerrule = blur_popups on,     match:namespace waybar

layerrule = blur on,            match:namespace walker
layerrule = ignore_alpha 0.06,  match:namespace walker

layerrule = blur on,            match:namespace notifications
layerrule = ignore_alpha 0.06,  match:namespace notifications

layerrule = blur on,            match:namespace swayosd
layerrule = ignore_alpha 0.06,  match:namespace swayosd

layerrule = blur on,            match:namespace logout_dialog
layerrule = ignore_alpha 0.06,  match:namespace logout_dialog
