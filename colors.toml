# Liquid Glass — a neutral palette.
#
# There is no theme colour here any more. Background, foreground, cursor,
# accent, selection and all four greys are neutral, so nothing tints the
# desktop from this file the way the old jade palette did.
#
# The ANSI slots below are the exception, and it is not a hedge. color2 is what
# `ls` paints a directory and what `git diff` paints an addition; color1 is what
# it paints a deletion. Those are not decoration — greying them out does not
# remove jade, it removes the ability to tell one thing from another. They keep
# their hues, minus the mint cast the green and cyan used to carry.
#
# Everything Omarchy generates (btop, helix, obsidian, gum, chromium,
# hyprlock…) is derived from these values.
#
# ── Glass material tokens ─────────────────────────────────────────────────
# These six carry no hue, and that is the single most important thing about
# them. Glass has no colour of its own; it takes the colour of whatever is
# behind it. Every token below is white or black at some alpha, so a surface
# built from them is a lens rather than a tinted sheet — over a green
# wallpaper it is green, over a photograph it is whatever the photograph is,
# and it needs no per-wallpaper retuning to stay coherent.
#
# The palette further down is a different matter and stays as it is: terminal
# and syntax colours have to be distinguishable from each other, which is a
# job hue does and alpha cannot.
#
# Reference only. GTK-CSS cannot import from a TOML file, so waybar.css,
# walker.css and swayosd.css each spell these out inline and name the token in
# a comment above the declaration. This block is the one place they are
# defined; if you change a value here, grep the token name and update every
# site. The values below are what those three files now agree on — they used
# to drift by a few points of alpha per file, which is invisible on any one
# surface and obvious when two sit next to each other.
#
#   glass-fill-top   rgba(255, 255, 255, 0.16)
#       Top stop of the pane gradient. The lit edge where the glass curves up
#       to meet the light — the brightest point of the body.
#
#   glass-fill-mid   rgba(0, 0, 0, 0.28)
#       Middle stop, at 45%. The body of the lens, where it is thickest.
#
#   glass-fill-base  rgba(0, 0, 0, 0.35)
#       Bottom stop. Where the pane falls into its own shadow.
#
#   glass-edge       rgba(255, 255, 255, 0.21)
#       The 1px rim around a surface. Reads as the cut edge of the sheet.
#
#   glass-specular   rgba(255, 255, 255, 0.34)
#       inset 0 1px 0 — the highlight running along the top edge. Remove this
#       one line and every surface in the theme goes flat instantly.
#
#   glass-shade      rgba(0, 0, 0, 0.29)
#       inset 0 -1px 0 — the shaded underside, paired with glass-specular.
#
# Two documented exceptions, both because the surface cannot carry the full
# recipe: waybar's `tooltip` keeps an opaque base (it lands over app windows,
# not the wallpaper), and mako.ini keeps a 0.30 rim (no gradient, no inset —
# the rim is its entire material). Both are commented at the site.
#
# There is a seventh element, and it is deliberately not in the list above
# because only one kind of surface can have it. Windows get an *inner rim*
# from the compositor — see decoration:glow in hyprland.conf — which fades
# white inward from the edge over 14px, following the same superellipse the
# corner is cut on. That is the thing glass-specular is imitating. A hairline
# is what GTK-CSS can draw; a 14px ramp computed from the window's own
# geometry is what the material actually wants, and the shell surfaces cannot
# have it at any alpha because GTK has no equivalent primitive.
#
# So the six tokens above are not the material. They are the best available
# approximation of it on surfaces that cannot ask the compositor for the real
# thing, and the gap between a window's rim and a panel's is the size of that
# compromise. Worth knowing before trying to "fix" the panels to match.
#
# ── Corner radius scale ───────────────────────────────────────────────────
# Reference only, same as above: each site names its step in a comment.
# Roughly, the bigger the surface the rounder it gets, so a panel and the
# controls sitting on it never share a radius.
#
#   radius-xl  26px   launcher panel
#   radius-lg  22px   OSD
#   radius-md  18px   notification
#              14px   bar pill, tooltip, launcher row
#   radius-sm   9px   workspace pill
#               8px   progress bar
#
# radius-md carries two values on purpose: 18px is a standalone surface, 14px
# is a surface with other surfaces on top of it. Both are "medium" in the same
# sense and neither wants the other's number.
#
# Every one of these is a *circular* arc. Windows are rounded by the
# compositor instead (hyprland.conf: rounding = 20, rounding_power = 4.5),
# which is a superellipse — continuous curvature rather than an arc pasted
# onto a straight edge, and visibly softer at the same nominal radius.
# GTK-CSS has no superellipse primitive and no way to fake one on a border,
# so the shell surfaces approximate it and stop there. That gap is a platform
# ceiling, not a defect — in particular, don't "fix" it by lowering
# rounding_power to make windows match the panels.
#
# ── Elevation scale ───────────────────────────────────────────────────────
# Outer drop shadows only. The inset highlight/shade pair is the *bevel* and
# belongs to the material, not to this scale — it does not change with height.
#
#   elev-1   0 3px 10px  rgba(0, 0, 0, 0.40)   bar        (OSD: see below)
#   elev-2   0 6px 18px  rgba(0, 0, 0, 0.45)   tooltip    (notification: below)
#   elev-3   0 12px 40px rgba(0, 0, 0, 0.50)   launcher
#
# Height is the surface's claim on your attention: the bar is always there,
# the launcher covers what you were doing. Offset, blur and opacity all rise
# together, because a thing further from the wall casts a shadow that is
# lower, softer and darker all at once — moving one without the others is
# what makes a shadow read as painted on.
#
# Two of the five surfaces cannot reach their level, both for the same
# underlying reason — an outer shadow needs room outside the box, and a layer
# surface is sized to its content:
#
#   OSD           no room and no inner child to paint on. Measured: the
#                 shadow renders nowhere outside and only bleeds through the
#                 translucent pane. Left out. See swayosd.css.
#   notification  mako has no shadow option at all, and Hyprland's shadow{}
#                 covers windows, not layer surfaces. See mako.ini.
#
# Even the bar only gets part of elev-1: it paints on `> box` inside a 38px
# surface with a 4px margin, so 4px of the shadow's ~13px reach survives and
# the rest clips. The scale is what these surfaces aim at, not a promise that
# every one of them lands it.

# ── Palette ───────────────────────────────────────────────────────────────
# Same duplication problem as the glass tokens above, and the same rule. The
# four terminal configs ship the whole palette themselves rather than being
# generated from this file, so every value below exists in five places. If you
# change one here, grep the hex and update alacritty.toml, ghostty.conf,
# kitty.conf and foot.ini — foot spells it twice, under [colors] and
# [colors-dark]. neovim.lua carries its own copy under aether's names.
#
# That is not a hypothetical: bright cyan sat at #FFFFFF in all four terminals
# for a while, against #96DCE2 here, so it was indistinguishable from bright
# white in a terminal and correct everywhere else.

accent               = "#FFFFFF"
cursor               = "#FFFFFF"
foreground           = "#E0E0E0"
background           = "#0A0A0A"
selection_foreground = "#0A0A0A"
selection_background = "#C8C8C8"

# Normal. These are the ANSI 16 and stay hues, for the reason at the top of the
# file. They are spread deliberately wide — syntax highlighting collapses into
# mush if every colour sits in the same wedge.
color0 = "#1A1A1A"
color1 = "#F2798F"
color2 = "#6FBF7A"
color3 = "#E5CE8A"
color4 = "#6FB6D6"
color5 = "#B49BE0"
color6 = "#74C7CE"
color7 = "#C6C6C6"

# Bright
color8  = "#6E6E6E"
color9  = "#FF97A8"
color10 = "#8FD895"
color11 = "#F5E2A8"
color12 = "#96CFE8"
color13 = "#CBB6F0"
color14 = "#96DCE2"
color15 = "#F2F2F2"
