# Liquid Glass — Mako
#
# Mako has no gradients, so the material here is carried by a genuinely
# transparent fill plus a bright rim — the blur behind it
# (`layerrule = blur on, match:namespace notifications`) does the rest.
# Colours carry an 8-digit #RRGGBBAA value.
#
# The radius below follows the 4-step scale documented in colors.toml. It is a
# circular arc approximating the superellipse the compositor gives windows
# (hyprland.conf: rounding_power = 4.5). Mako has no superellipse primitive
# either — border-radius is a single integer — so this is as close as a
# notification can get. A platform ceiling, not a bug to fix.

include=~/.local/share/omarchy/default/mako/core.ini

text-color=#EDEDED

# glass-edge — but at 0.30 rather than the canonical 0.21, on purpose.
# Everywhere else the rim is one cue among three: it sits on top of a
# top-to-base gradient and a specular inset. Mako supports neither, so this
# single line *is* the material. Thinned to 0.21 the notification stops
# reading as a pane and starts reading as a flat card. See colors.toml.
border-color=#FFFFFF4D

# No token: the six fill tokens describe a *ramp* (top/mid/base) and mako can
# only take one flat colour, so this is the ramp's average — black at an alpha
# that splits the difference between glass-fill-mid and glass-fill-base.
background-color=#00000073

progress-color=over #FFFFFF40

# radius-md (18px) — notification
border-radius=18
border-size=1

# elev-2 is the level a notification wants and mako cannot provide it: there
# is no shadow option in mako(5) at all, and Hyprland's shadow{} applies to
# windows, not layer surfaces, so there is no way to reach around it either.
# The rim above is carrying the separation on its own. Unlike the radius, this
# one is not an approximation — it is simply absent.
