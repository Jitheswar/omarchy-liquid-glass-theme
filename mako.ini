# Liquid Glass — Mako
#
# Frosting comes from `layerrule = blur on, match:namespace notifications`;
# the alpha in background-color is what gives the blur something to show
# through. Colours carry an 8-digit #RRGGBBAA value.

include=~/.local/share/omarchy/default/mako/core.ini

text-color=#D6E4DE
border-color=#A8E4D338
background-color=#122620A6
progress-color=over #6BCCA938

border-radius=16
border-size=1
